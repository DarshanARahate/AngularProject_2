<p>Users Form</p>

<div class="my-2">
    <label>User Name</label>
    <input type="text" class="form-control" (input)="onUpdateUser($event)" />
    <input type="text" class="form-control" [(ngModel)]="userName" />
    <div>{{ userName }}</div>
</div>

<button class="btn btn-primary" [disabled]="!allowNewUser" (click)="changeUserCreatedStatus()">Add Users</button>

<div *ngIf="isUserCreated; else noUser">
    User is created and the username is {{ userName }}
</div>
<ng-template #noUser>
    <div>
        No User is created
    </div>
</ng-template>

<div>{{ userCreatedStatus }}</div>
<div [innerText]="allowNewUser"> </div>

<app-user *ngFor="let user of users"></app-user>
